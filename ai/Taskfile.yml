version: '3'


tasks:
  # 生成 Python gRPC 代码
  gen:py:
    cmds:
      - python -m grpc_tools.protoc -I. --python_out=./python-server --grpc_python_out=./python-server ./proto/ai_service.proto

  # 生成 Go gRPC 代码
  gen:go:
    cmds:
      - protoc --go_out=./go-client --go_opt=paths=source_relative --go-grpc_out=./go-client --go-grpc_opt=paths=source_relative ./proto/ai_service.proto

  # 一键生成所有代码（Go + Python）
  gen:all:
    deps: [gen:py, gen:go]

  # 启动 Python gRPC 服务
  run:server:
    dir: python-server
    cmds:
      - python server.py

  # 启动 Go 客户端
  run:client:
    dir: go-client
    cmds:
      - go run client.go